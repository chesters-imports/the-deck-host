<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Deck Host — Launcher missing</title>
  <style>
    :root {
      --bg: #0a0c12;
      --ink: #d8dee8;
      --dim: #6a7a9a;
      --accent: #6a8cff;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #151a28 0%, var(--bg) 55%);
      color: var(--ink);
      padding: 2.5rem 1.5rem;
    }
    h1 {
      font-weight: 600;
      letter-spacing: 0.12em;
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--accent);
    }
    p { color: var(--dim); max-width: 36rem; line-height: 1.45; }
    code { color: #9ab0ff; }
  </style>
</head>
<body>
  <h1>The Deck Host</h1>
  <p>
    ROM Launcher did not start. The default product lives at
    <code>the-deck-host/rom-launcher</code>. Run
    <code>python deck_host.py</code> from a full island checkout, or
    <code>rom-launcher/prod/run-launcher.bat</code>.
  </p>
  <p>
    A single cart still opens with <code>--url</code>, <code>--spawn</code>,
    or <code>--rom-dir</code>.
  </p>
</body>
</html>
