<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROM Launcher · CO.HOST-001-LAUNCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Orbitron:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <!-- cart plastic: ONE file with ROM Cat (not a forked copy in app.css) -->
  <link rel="stylesheet" href="/rom-cart-face.css" />
  <link rel="stylesheet" href="/app.css" />
  <script>
    (function () {
      try {
        var id = localStorage.getItem("deck-launcher-shell") || "base";
        document.documentElement.setAttribute("data-launcher-shell", id);
        if (id !== "base") {
          var l = document.createElement("link");
          l.id = "launcher-shell-dsc";
          l.rel = "stylesheet";
          l.href = "/skins/launcher-" + id + ".dsc";
          document.head.appendChild(l);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="rl">
  <header class="rl-chrome" data-deck-chrome data-deck-drag-root data-deck-controls="min,max,close">
    <span class="rl-chip" data-deck-menu>DECK<strong>HOST</strong></span>
    <span class="rl-drag" data-deck-drag title="ROM Launcher">LAUNCH</span>
    <div class="rl-win" data-deck-window-controls></div>
  </header>

  <div class="rl-hero" data-deck-drag title="drag window">
    <!-- deep mode: caption hidden — title is the drag handle (REQ-007-CHG01) -->
    <h1 class="rl-title" data-deck-drag title="drag window · deep mode handle">ROM CASES</h1>
    <div class="rl-hero-actions">
      <button type="button" class="rl-unstick" id="btnInstall" title="Seat a .rom cart onto the shelf">INSTALL</button>
      <button type="button" class="rl-unstick" id="btnUnstick" title="Kill stuck ROM server.py / free ports (keeps this launcher)">UNSTICK</button>
      <button type="button" class="rl-refresh" id="btnRefresh" title="refresh">↻</button>
    </div>
  </div>

  <p class="rl-sub" id="sub">loading…</p>

  <main class="rl-grid" id="grid" aria-label="ROM cases by maker"></main>

  <footer class="rl-foot">
    <span>CO.HOST-001-LAUNCH</span>
    <span id="status">—</span>
  </footer>

  <div class="rl-toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
